<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410" role="img" aria-label="FSR4 at 1280x720 to 1920x1080 on the PS5 after each optimization step" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif"><title>FSR4 at 1280x720 to 1920x1080 on the PS5 after each optimization step</title><text x="16.0" y="26.0" font-size="17" fill="#f0f6fc" text-anchor="start" font-weight="600">1280×720 → 1920×1080: optimization steps</text><text x="16.0" y="46.0" font-size="12" fill="#9198a1" text-anchor="start" font-weight="normal">Milliseconds per frame from submission to completion (lower is better)</text><line x1="318.0" y1="68.0" x2="318.0" y2="376.0" stroke="#3d444d" stroke-width="1"/><text x="318.0" y="392.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal">0</text><line x1="385.4" y1="68.0" x2="385.4" y2="376.0" stroke="#3d444d" stroke-width="1"/><text x="385.4" y="392.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal">4</text><line x1="452.9" y1="68.0" x2="452.9" y2="376.0" stroke="#3d444d" stroke-width="1"/><text x="452.9" y="392.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal">8</text><line x1="520.3" y1="68.0" x2="520.3" y2="376.0" stroke="#3d444d" stroke-width="1"/><text x="520.3" y="392.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal">12</text><line x1="587.7" y1="68.0" x2="587.7" y2="376.0" stroke="#3d444d" stroke-width="1"/><text x="587.7" y="392.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal">16</text><line x1="655.1" y1="68.0" x2="655.1" y2="376.0" stroke="#3d444d" stroke-width="1"/><text x="655.1" y="392.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal">20</text><line x1="722.6" y1="68.0" x2="722.6" y2="376.0" stroke="#3d444d" stroke-width="1"/><text x="722.6" y="392.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal">24</text><line x1="790.0" y1="68.0" x2="790.0" y2="376.0" stroke="#3d444d" stroke-width="1"/><text x="790.0" y="392.0" font-size="11" fill="#9198a1" text-anchor="middle" font-weight="normal">28 ms</text><line x1="384.2" y1="68.0" x2="384.2" y2="376.0" stroke="#f85149" stroke-width="1.5" stroke-dasharray="5 4"/><text x="390.2" y="62.0" font-size="11" fill="#f85149" text-anchor="start" font-weight="normal">BC250 running AMD's shaders: 3.93 ms</text><text x="306.0" y="92.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="normal">First native run</text><rect x="318.0" y="79.0" width="455.1" height="18.0" rx="3" fill="#4493f8"/><text x="767.1" y="92.5" font-size="12" fill="#0d1117" text-anchor="end" font-weight="600">27 ms</text><text x="306.0" y="122.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="normal">Fused FP32 multiply-add</text><rect x="318.0" y="109.0" width="134.9" height="18.0" rx="3" fill="#4493f8"/><text x="458.9" y="122.5" font-size="12" fill="#f0f6fc" text-anchor="start" font-weight="normal" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">8.0 ms</text><text x="306.0" y="152.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="normal">Wave64 where it is faster</text><rect x="318.0" y="139.0" width="119.2" height="18.0" rx="3" fill="#4493f8"/><text x="443.2" y="152.5" font-size="12" fill="#f0f6fc" text-anchor="start" font-weight="normal" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">7.07 ms</text><text x="306.0" y="182.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="normal">Shader code prefetch into L2</text><rect x="318.0" y="169.0" width="105.7" height="18.0" rx="3" fill="#4493f8"/><text x="429.7" y="182.5" font-size="12" fill="#f0f6fc" text-anchor="start" font-weight="normal" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">6.27 ms</text><text x="306.0" y="212.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="normal">Forward instruction prefetch</text><rect x="318.0" y="199.0" width="64.2" height="18.0" rx="3" fill="#4493f8"/><text x="388.2" y="212.5" font-size="12" fill="#f0f6fc" text-anchor="start" font-weight="normal" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3.81 ms</text><text x="306.0" y="242.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="normal">Persistent command region</text><rect x="318.0" y="229.0" width="58.3" height="18.0" rx="3" fill="#4493f8"/><text x="382.3" y="242.5" font-size="12" fill="#f0f6fc" text-anchor="start" font-weight="normal" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3.46 ms</text><text x="306.0" y="272.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="normal">Generated INT8 network kernels</text><rect x="318.0" y="259.0" width="56.0" height="18.0" rx="3" fill="#4493f8"/><text x="380.0" y="272.5" font-size="12" fill="#f0f6fc" text-anchor="start" font-weight="normal" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3.32 ms</text><text x="306.0" y="302.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="normal">Looped kernels, cheaper requantization</text><rect x="318.0" y="289.0" width="51.4" height="18.0" rx="3" fill="#4493f8"/><text x="375.4" y="302.5" font-size="12" fill="#f0f6fc" text-anchor="start" font-weight="normal" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">3.05 ms</text><text x="306.0" y="332.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="normal">INT8 head linked into the postpass</text><rect x="318.0" y="319.0" width="48.9" height="18.0" rx="3" fill="#4493f8"/><text x="372.9" y="332.5" font-size="12" fill="#f0f6fc" text-anchor="start" font-weight="normal" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2.90 ms</text><text x="306.0" y="362.0" font-size="12" fill="#f0f6fc" text-anchor="end" font-weight="600">Hardware FP16 conversions, no border clears</text><rect x="318.0" y="349.0" width="45.0" height="18.0" rx="3" fill="#3fb950"/><text x="369.0" y="362.5" font-size="12" fill="#f0f6fc" text-anchor="start" font-weight="600" stroke="#0d1117" stroke-width="4" stroke-linejoin="round" paint-order="stroke">2.67 ms</text></svg>
