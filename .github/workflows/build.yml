#
# Builds the driver, the FSR4 runtime, the SDK, the demo and the showcase from
# pinned public inputs, runs the host tests and packages a release. Every run
# keeps the showcase app ZIP as a workflow artifact; a pull request's is named by
# its number and commit (docs/PULL_REQUEST_BUILDS.md). A v* tag publishes the
# package as a GitHub pre-release; a manual run with a version keeps all of it
# as a workflow artifact. docs/RELEASING.md has the procedure.
name: Build

on:
  # A build on main is started by hand (Run workflow): pushes to main build nothing.
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Version to package as an artifact (nothing is published)
        required: true
        default: 0.0.0-test

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    # The toolchain the pinned pipeline cache was made with: identical SPIR-V needs
    # the same glslang and SPIRV-Tools releases, and the payload SDK uses LLVM 21.
    container: ubuntu:26.04
    timeout-minutes: 240
    # id-token and attestations are for the "Attest the release files" step only.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '0.0.0-dev' }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bsdextrautils build-essential ca-certificates cmake curl file git glslang-tools make \
            ninja-build pkg-config python3 python3-mako python3-numpy python3-pil python3-yaml \
            spirv-tools tar unzip wget xxd xz-utils zlib1g-dev fonts-dejavu-core \
            clang-18 lld-18 llvm-18 clang-21 lld-21 llvm-21
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Version
        run: |
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Packaging version $VERSION"

      - name: Cache pinned inputs
        uses: actions/cache@v6
        with:
          path: build/inputs
          key: inputs-1-${{ hashFiles('tools/build_inputs.json') }}

      - name: Fetch pinned inputs
        run: python3 tools/fetch_build_inputs.py --github-env

      - name: Build the driver, the FSR4 runtime and the SDK
        run: make sdk

      - name: Check the pipeline cache
        run: python3 tools/fetch_build_inputs.py --check-cache

      - name: Host tests
        run: make check

      # A pull request's build is named by its number and its own commit, on the
      # artifact and in a file in the app folder (docs/PULL_REQUEST_BUILDS.md); the
      # version stays what it is.
      - name: Name this build
        id: label
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ $GITHUB_EVENT_NAME == pull_request ]]; then
            short=${PR_HEAD:0:7}
            echo "artifact=${GITHUB_REPOSITORY##*/}-PR$PR_NUMBER-$short" >> "$GITHUB_OUTPUT"
            echo "BUILD_LABEL=PR $PR_NUMBER, $short" >> "$GITHUB_ENV"
          else
            echo "artifact=ps5-fsr4-showcase-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the demo and the showcase
        run: |
          make demo
          make showcase SHOWCASE_ARGS="--release $VERSION"

      - name: Package
        run: python3 tools/package_fsr4_release.py --version "$VERSION"

      # The console only starts an app whose files are open to all, and some
      # tools keep a ZIP's permissions when they unpack it.
      - name: Check the showcase ZIP
        run: |
          python3 - "build/release/ps5-fsr4-showcase-$VERSION-PPSA99011.zip" PPSA99011 <<'PY'
          import sys, zipfile
          archive, title = sys.argv[1:3]
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None, "damaged entry"
              names = z.namelist()
              assert title + "/eboot.bin" in names, "no eboot.bin"
              wrong = [i.filename for i in z.infolist() if (i.external_attr >> 16) & 0o777 != 0o777]
              assert not wrong, f"entries not stored as 0777: {wrong[:3]}"
              print(f"{archive}: {len(names)} entries, all 0777")
          PY

      # Signed provenance: these files were built by this workflow from this commit. Anyone can check
      # a downloaded copy with `gh attestation verify <file> -R <owner>/<repo>`. Not for pull requests
      # (a fork's run cannot sign), and not in a private repository (the plan does not include it).
      - name: Attest the release files
        if: github.event_name != 'pull_request' && !github.event.repository.private && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/release/ps5-fsr4-showcase-${{ env.VERSION }}-PPSA99011.zip
            build/release/ps5-fsr4-sdk-${{ env.VERSION }}.zip
            build/release/ps5-fsr4-${{ env.VERSION }}-source.tar.gz

      - name: Keep the showcase ZIP
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.label.outputs.artifact }}
          path: build/release/ps5-fsr4-showcase-${{ env.VERSION }}-PPSA99011.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Keep the package
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: build/release/
          retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "PS5 FSR4 ${GITHUB_REF_NAME#v}" --notes-file release-notes.md \
            *.zip *.tar.gz SHA256SUMS
